# Зеленогорье — подключается внутрь http {} основного nginx.conf
# (Homebrew: ссылка в /opt/homebrew/etc/nginx/servers/). Собирается install.sh из шаблона.

map $http_upgrade $zg_connection_upgrade {
    default upgrade;
    ''      close;
}

# Мягкий лимит на вход; основной лимит (по участнику и IP) — в приложении.
limit_req_zone $binary_remote_addr zone=zg_auth:1m rate=60r/m;

# Любое другое имя (чужие зоны Cloudflare, направленные на наш IP, сканеры по IP) — TLS закрывается сразу.
server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name {{DOMAIN}};

    ssl_certificate     {{TLS_DIR}}/origin.pem;
    ssl_certificate_key {{TLS_DIR}}/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:zg_ssl:5m;

    # Authenticated Origin Pulls: соединение принимается только с клиентским сертификатом Cloudflare.
    ssl_client_certificate {{TLS_DIR}}/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    # Только адреса Cloudflare (файлы пересобирает update-cf-ips.sh раз в неделю).
    include {{ZG_ROOT}}/data/ops-state/cloudflare-allow.conf;
    deny all;
    include {{ZG_ROOT}}/data/ops-state/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    access_log {{ZG_ROOT}}/logs/nginx-access.log;
    error_log  {{ZG_ROOT}}/logs/nginx-error.log warn;

    client_max_body_size 15m;
    root {{ZG_ROOT}}/current/web/dist;

    # Оболочка и service worker — всегда свежие.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }
    # Хэшированные ассеты — на год.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/auth/ {
        limit_req zone=zg_auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zg_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA: любой путь без файла — index.html.
    location / {
        try_files $uri /index.html;
    }
}
