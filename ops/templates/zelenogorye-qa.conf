# Зеленогорье, закрытый QA-хост — подключается рядом с zelenogorye.conf (оттуда же default_server на 8443,
# закрывающий чужие имена). Собирается qa-setup.sh из шаблона.
#
# Что скрывает хост:
#   - имя не светится: Cloudflare Universal SSL выдаёт wildcard, в журналы прозрачности попадает только *.домен;
#   - в DNS — проксируемая (оранжевая) запись, настоящий IP снаружи не виден;
#   - только Cloudflare (Authenticated Origin Pulls + allow-список), как у основного сайта;
#   - пароль на входе (basic auth): в dev-базе PIN-ы известные, без пароля её видел бы любой, кто угадал имя;
#   - noindex для поисковиков, ничего не логируется в общий журнал основного сайта.
# Проксирует на Vite (5173): он отдаёт интерфейс и сам передаёт /api и /socket.io на dev-сервер 3001.

map $http_upgrade $zg_qa_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name {{QA_DOMAIN}};

    ssl_certificate     {{TLS_DIR}}/origin.pem;
    ssl_certificate_key {{TLS_DIR}}/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:zg_qa_ssl:5m;

    ssl_client_certificate {{TLS_DIR}}/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    include {{ZG_ROOT}}/data/ops-state/cloudflare-allow.conf;
    deny all;
    include {{ZG_ROOT}}/data/ops-state/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    auth_basic "QA";
    auth_basic_user_file {{QA_HTPASSWD}};

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log {{ZG_ROOT}}/logs/nginx-qa-access.log;
    error_log  {{ZG_ROOT}}/logs/nginx-qa-error.log warn;

    client_max_body_size 15m;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zg_qa_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
