# Зеленогорье, закрытый QA-хост за Cloudflare Tunnel. Собирается qa-setup.sh в servers/ nginx (Homebrew).
#
# Путь запроса: https://{{QA_DOMAIN}} → Cloudflare → cloudflared на этом Mac → nginx :8080 (этот блок)
# → Vite :5173 (интерфейс, сам передаёт /api и /socket.io на dev-сервер :3001, dev-база).
#
# Что делает хост закрытым:
#   - снаружи только через туннель: ни открытых портов на роутере, ни IP в DNS;
#   - в nginx пускаются только соединения с этого Mac (их делает cloudflared), из локальной сети напрямую — 403;
#   - пароля на входе нет: dev-базу с известными PIN-ами видит любой, кто знает имя (решение Рустема);
#   - noindex для поисковиков, отдельные логи.

map $http_upgrade $zg_qa_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      8080;
    server_name {{QA_DOMAIN}};

    allow 127.0.0.1;
    allow ::1;
    deny  all;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log {{LOG_DIR}}/zelenogorye-qa-access.log;
    error_log  {{LOG_DIR}}/zelenogorye-qa-error.log warn;

    client_max_body_size 15m;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zg_qa_connection_upgrade;
        proxy_set_header Host $host;
        # Настоящий адрес игрока присылает Cloudflare; без него все тестеры были бы 127.0.0.1 для лимита входа.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        # Dev-сервер меняет модули при каждой правке. Cloudflare подменяет его «no-cache» на max-age (Browser Cache TTL),
        # и браузер держит старые модули часами (Safari: «Importing binding name … is not found»). Запрещаем хранить вовсе.
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
    }
}
