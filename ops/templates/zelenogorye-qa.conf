# Зеленогорье, закрытый QA-хост за Cloudflare Tunnel. Собирается qa-setup.sh в servers/ nginx (Homebrew).
#
# Путь запроса: https://{{QA_DOMAIN}} → Cloudflare → cloudflared на этом Mac → nginx :8080 (этот блок)
# → Vite :5173 (интерфейс, сам передаёт /api и /socket.io на dev-сервер :3001, dev-база).
#
# Что делает хост закрытым:
#   - снаружи только через туннель: ни открытых портов на роутере, ни IP в DNS;
#   - в nginx пускаются только соединения с этого Mac (их делает cloudflared), из локальной сети напрямую — 403;
#   - пароль на входе (basic auth): в dev-базе PIN-ы известные, без пароля её видел бы любой, кто угадал имя;
#   - noindex для поисковиков, отдельные логи.

map $http_upgrade $zg_qa_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      8080;
    server_name {{QA_DOMAIN}};

    allow 127.0.0.1;
    allow ::1;
    deny  all;

    auth_basic "Zelenogorye QA";
    auth_basic_user_file {{QA_HTPASSWD}};

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log {{LOG_DIR}}/zelenogorye-qa-access.log;
    error_log  {{LOG_DIR}}/zelenogorye-qa-error.log warn;

    client_max_body_size 15m;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zg_qa_connection_upgrade;
        proxy_set_header Host $host;
        # Настоящий адрес игрока присылает Cloudflare; без него все тестеры были бы 127.0.0.1 для лимита входа.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
